replicaCount: 1

image:
  repository: netboxcommunity/netbox
  tag: v3.6.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: netbox.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

postgresql:
  enabled: true  # Set to false if using an external database
  host: netbox-db
  database: netbox
  username: netbox
  password: netboxpassword

  external:
    enabled: false  # Set to true to use an external DB
    host: "external-db-host"
    port: 5432
    database: "external-netbox"
    username: "external-user"
    password: "external-password"

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

persistence:
  enabled: true
  size: 10Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# NetBox Plugins
plugins:
  enabled: true
  list:
    - netbox_plugin_example
  config:
    netbox_plugin_example:
      setting1: "value1"
      setting2: "value2"
# DB Backup Settings
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retentionDays: 7        # Keep backups for 7 days
  storage:
    pvc:
      enabled: true
      size: 5Gi
    s3:
      enabled: false
      bucket: "my-netbox-backups"
      region: "us-east-1"
      accessKey: "your-access-key"
      secretKey: "your-secret-key"
# DB Restore Settings
restore:
  enabled: true
  backupFile: "latest.sql.gz"
