apiVersion: batch/v1
kind: Job
metadata:
  name: netbox-plugin-installer
spec:
  template:
    spec:
      containers:
        - name: plugin-installer
          image: netboxcommunity/netbox:v3.6.2
          command:
            - /bin/sh
            - -c
            - |
              echo "Installing NetBox Plugins..."
              pip install {{ join " " .Values.config.plugins.list }}
              echo "Applying Migrations..."
              python /opt/netbox/netbox/manage.py migrate
              echo "Restarting NetBox..."
      restartPolicy: Never